<h1>我怎么用 Grok Bot</h1>
<p class="desc">一群各管一件事的 bot：早上收信息，白天帮写作和工作，晚上自己巡检，只在需要我时开口。</p>

</main><script>

["in","Mediasoup","扫关注的播客，写成中文早报。","日 / 一 / 三 / 五 06:36","Spotify、YouTube、Substack","它的对话"],
["in","Researcher","按需查证和研究；为「有所启发」找候选，Yishan 选定后 30 分钟内核对。","按需；周五 10:17","研究问题、候选素材","BotWiki、协作群"],

["work","Larkin","只读汇总飞书工作群和 @ 我的消息。","三 / 五 ~16:25","飞书工作群、@ 消息","它的对话"],

["work","Productivo","和 Yishan 一起想产品决策、规格和路线图。","无固定时间","想法、讨论","决策、规格、路线图"],

const F=[["1","「有所启发」· 周五",["<em>Mediasoup 10:23</em> + <em>Researcher 10:17</em> 写候选","11:00 前进 BotWiki 草稿","<em>Nutrient</em> 12:00 前发 8–10 条清单到协作群","Yishan 挑选","<em>Researcher</em> 30 分钟内核对","<em>Pencile</em> 周六前交稿"]],
["2","周报",["<em>Linewatch</em> 一三五扫 Linear","<em>Grokie</em> 周五 15:30 备料","Yishan 确认重点","17:35 成稿并打印"]],
["3","新 bot",["Yishan 提需求","<em>dr eggbot</em> 问偏好并创建","每晚巡检只报异常"]]];
document.getElementById("flows").innerHTML=F.map(([n,t,s])=>`<div class="flow"><h3><span>[${n}]</span> ${t}</h3><div class="steps">${s.map(x=>`<div class="st">${x}</div>`).join('<span class="ar">──▶</span>')}</div></div>`).join("");
