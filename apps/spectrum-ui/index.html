<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Spectrum UI showcase — xbm demo. Animated components for agent UIs, rebuilt with React, Motion, and Tailwind."
    />
    <title>Spectrum UI showcase — xbm demo</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Follow the system light/dark setting (shadcn's .dark class).
      ;(() => {
        const m = matchMedia("(prefers-color-scheme: dark)")
        const apply = () => document.documentElement.classList.toggle("dark", m.matches)
        apply()
        m.addEventListener("change", apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
