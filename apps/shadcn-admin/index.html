<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="shadcn-admin showcase — admin dashboard UI with shadcn/ui, Vite and TanStack Router (inspired by satnaing/shadcn-admin, MIT)" />
    <title>Shadcn Admin · showcase</title>
    <script>
      try {
        var t = localStorage.getItem("shadcn-admin-theme") || "system";
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
